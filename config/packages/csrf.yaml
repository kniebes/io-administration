# Enable stateless CSRF protection for logins/logouts.
# Symfony Forms (token_id: submit) and the tag-create endpoint use classic,
# session-based CSRF instead - the stateless/Origin-based check proved unreliable
# for the BlogPost form and its fetch()-based tag-create endpoint.
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - authenticate
            - logout
